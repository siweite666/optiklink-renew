name: OptikLink Auto Login

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: 🌐 设置sing-box代理转发 (SOCKS5 :1080)
        continue-on-error: true
        env:
          VMESS_UUID: ${{ secrets.VMESS_UUID }}
          VMESS_SNI: ${{ secrets.VMESS_SNI }}
          VMESS_PATH: ${{ secrets.VMESS_PATH }}
        run: |
          echo "启动 sing-box 代理 (SOCKS5 inbound)"
          # 用现有 VMess secrets 构造 vmess:// 链接作为 NODE_LINK
          VMESS_JSON="{\"v\":\"2\",\"ps\":\"optiklink\",\"add\":\"cf.877774.xyz\",\"port\":\"443\",\"id\":\"$VMESS_UUID\",\"aid\":\"0\",\"scy\":\"auto\",\"net\":\"ws\",\"type\":\"none\",\"host\":\"$VMESS_SNI\",\"path\":\"$VMESS_PATH\",\"tls\":\"tls\",\"sni\":\"$VMESS_SNI\"}"
          NODE_LINK="vmess://$(echo -n "$VMESS_JSON" | base64 -w0)"
          export NODE_LINK
          wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh > /tmp/setup_proxy.sh
          # 修复: 未认证的 GitHub API 请求会触发 rate limit，给 curl 加上认证头
          sed -i 's|curl -s "https://api.github.com/repos/SagerNet/sing-box/releases"|curl -s -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/SagerNet/sing-box/releases"|' /tmp/setup_proxy.sh
          bash /tmp/setup_proxy.sh

      - name: Run login script
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TG_BOT: ${{ secrets.TG_CHAT_ID }},${{ secrets.TG_BOT_TOKEN }}
          PROXY_URL: "socks5://127.0.0.1:1080"
          # Pterodactyl 开机检测（可选，不配就跳过）
          PTERODACTYL_API_KEY: ${{ secrets.PTERODACTYL_API_KEY }}
          PTERODACTYL_PANEL_URL: ${{ secrets.PTERODACTYL_PANEL_URL }}
          PTERODACTYL_SERVER_ID: ${{ secrets.PTERODACTYL_SERVER_ID }}
        run: npx playwright test

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
