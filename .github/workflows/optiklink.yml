name: OptikLink Auto Login

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Install & start xray
        run: |
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) XRAY_ARCH="64" ;;
            aarch64) XRAY_ARCH="arm64-v8a" ;;
            *) echo "::error::Unsupported arch: $ARCH"; exit 1 ;;
          esac
          mkdir -p /tmp/xray
          curl -sLfo /tmp/xray.zip "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-${XRAY_ARCH}.zip"
          unzip -o /tmp/xray.zip -d /tmp/xray/
          chmod +x /tmp/xray/xray

          jq -n --arg uuid "$VMESS_UUID" --arg sni "$VMESS_SNI" --arg path "$VMESS_PATH" '{
            log: {loglevel: "warning"},
            inbounds: [
              {tag: "socks-in", listen: "127.0.0.1", port: 1080, protocol: "socks", settings: {udp: true, auth: "noauth"}}
            ],
            outbounds: [{
              tag: "proxy",
              protocol: "vmess",
              settings: {"vnext": [{"address": "cdns.doon.eu.org", "port": 443, "users": [{"id": $uuid, "alterId": 0, "security": "auto"}]}]},
              streamSettings: {
                "network": "ws",
                "security": "tls",
                "tlsSettings": {"serverName": $sni, "allowInsecure": false},
                "wsSettings": {"path": $path, "headers": {"Host": $sni}}
              }
            }]
          }' > /tmp/xray/xray.json

          nohup /tmp/xray/xray run -c /tmp/xray/xray.json > /tmp/xray/xray.log 2>&1 &
          sleep 4
          if ! curl -s --max-time 10 --socks5 127.0.0.1:1080 -o /dev/null -w "%{http_code}" https://api.ipify.org | grep -q '^2'; then
            echo "::error::xray proxy self-check failed"
            cat /tmp/xray/xray.log
            exit 1
          fi
          echo "✅ SOCKS5 proxy ready"
        env:
          VMESS_UUID: ${{ secrets.VMESS_UUID }}
          VMESS_SNI: ${{ secrets.VMESS_SNI }}
          VMESS_PATH: ${{ secrets.VMESS_PATH }}

      - name: Run login script
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TG_BOT: ${{ secrets.TG_CHAT_ID }},${{ secrets.TG_BOT_TOKEN }}
          PROXY_URL: "socks5://127.0.0.1:1080"
          # Pterodactyl 开机检测（可选，不配就跳过）
          PTERODACTYL_API_KEY: ${{ secrets.PTERODACTYL_API_KEY }}
          PTERODACTYL_PANEL_URL: ${{ secrets.PTERODACTYL_PANEL_URL }}
          PTERODACTYL_SERVER_ID: ${{ secrets.PTERODACTYL_SERVER_ID }}
        run: npx playwright test

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
