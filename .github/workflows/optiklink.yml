name: OptikLink Auto Login

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Install v2ray
        run: |
          bash <(curl -L https://raw.githubusercontent.com/v2fly/fhs-install-v2ray/master/install-release.sh)
          cp v2ray.json /usr/local/etc/v2ray/config.json
          systemctl start v2ray
          sleep 2
          echo "v2ray SOCKS5 proxy on 127.0.0.1:1080"
          curl -s --socks5 127.0.0.1:1080 --connect-timeout 10 https://api.ipify.org || echo "proxy not ready"

      - name: Run login script
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TG_BOT: ${{ secrets.TG_CHAT_ID }},${{ secrets.TG_BOT_TOKEN }}
          PROXY_URL: "socks5://127.0.0.1:1080"
        run: npx playwright test

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
